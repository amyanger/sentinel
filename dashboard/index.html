<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel Anticheat</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <h1><span class="logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L3 6v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z" stroke="#00d4aa" stroke-width="1.8" fill="none"/><path d="M12 7.5c-1.1 0-2 .6-2.4 1.5h-.1c-.8 0-1.5.7-1.5 1.5v3c0 .8.7 1.5 1.5 1.5h5c.8 0 1.5-.7 1.5-1.5v-3c0-.8-.7-1.5-1.5-1.5h-.1c-.4-.9-1.3-1.5-2.4-1.5zm0 1.2c.6 0 1.1.4 1.3 1h-2.6c.2-.6.7-1 1.3-1zm-3 2.3h6v3h-6v-3zm3 .5a.8.8 0 100 1.6.8.8 0 000-1.6z" fill="#00d4aa"/></svg></span> Sentinel</h1>
        <div class="version">v1.0.0 &mdash; anticheat</div>
      </div>

      <nav class="sidebar__nav">
        <div class="nav-item nav-item--active" data-view="status">
          <span class="nav-item__icon">&#x25C9;</span> Status
        </div>
        <div class="nav-item" data-view="devices">
          <span class="nav-item__icon">&#x2699;</span> Devices
        </div>
        <div class="nav-item" data-view="alerts">
          <span class="nav-item__icon">&#x26A0;</span> Alerts
        </div>
        <div class="nav-item" data-view="config">
          <span class="nav-item__icon">&#x2630;</span> Config
        </div>
        <div class="nav-item" data-view="logs">
          <span class="nav-item__icon">&#x2263;</span> Logs
        </div>
        <div class="nav-item" data-view="collector">
          <span class="nav-item__icon">&#x2728;</span> Collector
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="conn-status">
          <span class="status-dot status-dot--offline" id="conn-dot"></span>
          <span id="conn-label">Connecting...</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn--sm topbar__menu-btn" id="menu-btn">&#x2630;</button>
          <span class="topbar__title" id="topbar-title">Status</span>
        </div>
        <div class="topbar__actions">
          <label style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">
            Refresh
            <select id="refresh-select" style="padding:4px 8px;font-size:12px">
              <option value="3000">3s</option>
              <option value="5000" selected>5s</option>
              <option value="10000">10s</option>
              <option value="30000">30s</option>
              <option value="60000">60s</option>
            </select>
          </label>
        </div>
      </header>

      <div class="content">
        <div id="view-status"  class="view view--active"></div>
        <div id="view-devices" class="view"></div>
        <div id="view-alerts"  class="view"></div>
        <div id="view-config"  class="view"></div>
        <div id="view-logs"    class="view"></div>
        <div id="view-collector" class="view"></div>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Collector settings modal -->
  <div class="modal" id="collector-settings-modal" hidden>
    <div class="modal__backdrop" data-close="collector-settings-modal"></div>
    <div class="modal__panel">
      <header class="modal__header">
        <h2>Collector Settings</h2>
        <button class="btn btn--sm" data-close="collector-settings-modal">&times;</button>
      </header>
      <div class="modal__body">
        <label class="form-row">
          <span>Collector URL</span>
          <input type="text" id="collector-url-input" placeholder="http://localhost:18443" />
        </label>
        <label class="form-row">
          <span>Admin API key</span>
          <input type="password" id="collector-key-input" placeholder="64-hex-char admin key" />
        </label>
        <p class="form-help" id="collector-test-result"></p>
      </div>
      <footer class="modal__footer">
        <button class="btn" id="collector-test-btn">Test connection</button>
        <button class="btn btn--primary" id="collector-save-btn">Save</button>
      </footer>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/collector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
