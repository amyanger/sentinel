<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel Anticheat</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <h1><span class="logo-icon">S</span> Sentinel</h1>
        <div class="version">v1.0.0 &mdash; anticheat</div>
      </div>

      <nav class="sidebar__nav">
        <div class="nav-item nav-item--active" data-view="status">
          <span class="nav-item__icon">&#x25C9;</span> Status
        </div>
        <div class="nav-item" data-view="devices">
          <span class="nav-item__icon">&#x2699;</span> Devices
        </div>
        <div class="nav-item" data-view="alerts">
          <span class="nav-item__icon">&#x26A0;</span> Alerts
        </div>
        <div class="nav-item" data-view="config">
          <span class="nav-item__icon">&#x2630;</span> Config
        </div>
        <div class="nav-item" data-view="logs">
          <span class="nav-item__icon">&#x2263;</span> Logs
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="conn-status">
          <span class="status-dot status-dot--offline" id="conn-dot"></span>
          <span id="conn-label">Connecting...</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn--sm topbar__menu-btn" id="menu-btn">&#x2630;</button>
          <span class="topbar__title" id="topbar-title">Status</span>
        </div>
        <div class="topbar__actions">
          <label style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">
            Refresh
            <select id="refresh-select" style="padding:4px 8px;font-size:12px">
              <option value="3000">3s</option>
              <option value="5000" selected>5s</option>
              <option value="10000">10s</option>
              <option value="30000">30s</option>
              <option value="60000">60s</option>
            </select>
          </label>
        </div>
      </header>

      <div class="content">
        <div id="view-status"  class="view view--active"></div>
        <div id="view-devices" class="view"></div>
        <div id="view-alerts"  class="view"></div>
        <div id="view-config"  class="view"></div>
        <div id="view-logs"    class="view"></div>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
